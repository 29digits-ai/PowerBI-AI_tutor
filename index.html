          correctQuizIndex: 0

    // ============================================================================

    //    Replicates the exact Windows Power BI Desktop VM from the DataCamp video
    // ============================================================================
    function EmbeddedPowerBIWorkspace({
      course,
      chapter,
      currentStage,
      pbiState,
      setPbiState,
      onTriggerSuccessToast
    }) {
      const ds = WORKSPACE_DATASETS[course.datasetKey] || WORKSPACE_DATASETS.faro;
      const factTable = ds.tables[0];
      const dimTable = ds.tables[1];

      // Local modals inside the simulated Power BI Desktop window
      const [showGetDataAnnouncement, setShowGetDataAnnouncement] = useState(false);
      const [showGetDataModal, setShowGetDataModal] = useState(false);
      const [selectedConnector, setSelectedConnector] = useState('Text/CSV');
      const [showFileExplorer, setShowFileExplorer] = useState(false);
      const [explorerFolder, setExplorerFolder] = useState('Desktop');
      const [selectedCsvFile, setSelectedCsvFile] = useState(null);
      const [csvPreviewFile, setCsvPreviewFile] = useState(null);
      const [loadingOverlayText, setLoadingOverlayText] = useState(null);

      // Relationship context menu & dialog in Model View
      const [relMenuOpen, setRelMenuOpen] = useState(false);
      const [showDeleteRelConfirm, setShowDeleteRelConfirm] = useState(false);
      const [showEditRelModal, setShowEditRelModal] = useState(false);

      // Right-hand collapsible panes inside Power BI Desktop
      const [filtersExpanded, setFiltersExpanded] = useState(false);
      const [vizExpanded, setVizExpanded] = useState(true);
      const [dataExpanded, setDataExpanded] = useState(true);
      const [vizSubTab, setVizSubTab] = useState('build'); // 'build' | 'format'
      const [expandedTablesInPane, setExpandedTablesInPane] = useState({ [factTable.name]: true, [dimTable.name]: true });
      const [zoomLevel, setZoomLevel] = useState(72);

      // Sync initial view when stage changes if needed
      useEffect(() => {
        if (currentStage?.initialPbiView && !pbiState.userChangedViewManually) {
          setPbiState((prev) => ({ ...prev, activeView: currentStage.initialPbiView }));
        }
      }, [currentStage?.id]);

      // Helper to simulate loading spinner modal ("Evaluating... -> Loading 21,663 rows...")
      const runSimulatedLoad = (fileObj, callback) => {
        setCsvPreviewFile(null);
        setLoadingOverlayText(`Connecting to ${fileObj.name}.csv...`);
        setTimeout(() => {
          setLoadingOverlayText(`Loading data from ${fileObj.name}.csv (${fileObj.totalRows} rows loaded)...`);
        }, 450);
        setTimeout(() => {
          setLoadingOverlayText(null);
          callback();
        }, 950);
      };

      // One-Click "Auto-Perform Current Step" button so learners never get stuck
      const handleAutoPerformCurrentTask = () => {
        const task = currentStage?.requiredTask;
        if (task === 'load_fact') {
          setPbiState((prev) => ({
            ...prev,
            loadedTables: Array.from(new Set([...prev.loadedTables, factTable.name])),
            activeView: 'table',
            selectedTableInView: factTable.name
          }));
          onTriggerSuccessToast(`Loaded ${factTable.name}.csv and opened Table View!`);
        } else if (task === 'load_dim') {
          setPbiState((prev) => ({
            ...prev,
            loadedTables: Array.from(new Set([...prev.loadedTables, factTable.name, dimTable.name])),
            selectedTableInView: dimTable.name
          }));
          onTriggerSuccessToast(`Loaded ${dimTable.name}.csv into the model!`);
        } else if (task === 'model_relationship') {
          setPbiState((prev) => ({
            ...prev,
            loadedTables: Array.from(new Set([...prev.loadedTables, factTable.name, dimTable.name])),
            activeView: 'model',
            relationshipActive: true,
            relationshipVerified: true
          }));
          onTriggerSuccessToast(`Verified 1:* relationship on ${ds.joinKey} in Model View!`);
        } else if (task === 'apply_dax_or_pq') {
          setPbiState((prev) => ({
            ...prev,
            daxMeasureCommitted: true,
            showFormulaBar: true
          }));
          onTriggerSuccessToast(`Committed DAX formula: ${chapter.daxFormula.split('=')[0]}!`);
        } else if (task === 'build_visual') {
          setPbiState((prev) => ({
            ...prev,
            loadedTables: Array.from(new Set([...prev.loadedTables, factTable.name, dimTable.name])),
            activeView: 'report',
            selectedVisualType: 'card',
            checkedFields: Array.from(new Set([...prev.checkedFields, ds.kpiMetricField]))
          }));
          onTriggerSuccessToast(`Created Card visual with ${ds.kpiLabel}!`);
        }
      };

      const hi = currentStage?.targetHighlight || '';

      return (
        <div className="h-full w-full flex flex-col bg-[#f3f2f1] text-slate-800 select-none overflow-hidden border-l border-slate-200">

              TOP VM UTILITY BAR (Reconnect | Force Refresh | Auto-Do Step)

              {currentStage?.requiredTask && (
                <button
                  onClick={handleAutoPerformCurrentTask}

                  title="Automatically execute the required Power BI clicks for this step"

                  <SparklesIcon className="w-3.5 h-3.5 text-indigo-600" /> Auto-Complete Step in Power BI

                  setShowGetDataModal(false);

              POWER BI DESKTOP WINDOW TITLE BAR

                <FileCsvIcon className="w-4 h-4 text-emerald-700" /> Text/CSV

              <button

                    showFormulaBar: true,
                    daxMeasureCommitted: true

                onClick={() =>

          setAvailableVoices(vList);
          if (!selectedVoiceURI && vList.length > 0) {
            const preferred = vList.find((v) => v.lang.startsWith('en') && v.name.includes('Natural')) || vList.find((v) => v.lang.startsWith('en')) || vList[0];
            if (preferred) setSelectedVoiceURI(preferred.voiceURI);
          }
        };
        loadVoices();
        window.speechSynthesis.onvoiceschanged = loadVoices;
      }, []);

      // Trigger temporary toast banner
      const triggerToast = (msg) => {
        setToastBanner(msg);
        setTimeout(() => setToastBanner(null), 3200);
      };

      // Download complete standalone index.html file directly from browser
      const handleDownloadStandaloneHtml = () => {
        const fullHtml = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
        const blob = new Blob([fullHtml], { type: 'text/html;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'index.html';
        a.click();
        URL.revokeObjectURL(url);
        triggerToast('Downloaded standalone index.html file!');
      };

      // Speak text via Web Speech API
      const speakTutorText = (textToSpeak, onFinishedCallback) => {
        if (!audioEnabled || !('speechSynthesis' in window)) {
          if (onFinishedCallback) onFinishedCallback();
          return;
        }
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(textToSpeak);
        utter.rate = audioSpeed;
        if (selectedVoiceURI) {
          const matchedVoice = availableVoices.find((v) => v.voiceURI === selectedVoiceURI);
          if (matchedVoice) utter.voice = matchedVoice;
        }
        utter.onstart = () => setIsSpeaking(true);
        utter.onend = () => {
          setIsSpeaking(false);
          if (onFinishedCallback) onFinishedCallback();
        };
        utter.onerror = () => setIsSpeaking(false);
        window.speechSynthesis.speak(utter);
      };

      // Whenever stage changes, animate paragraph reveal + read aloud
      useEffect(() => {
        setVerificationFeedback(null);
        setStageConversation([]);
        const paragraphs = currentStage.tutorParagraphs || [];

        if (textFlowMode === 'sentence') {
          setVisibleParagraphCount(1);
          setCharStreamLength(9999);
          let currentP = 1;
          const interval = setInterval(() => {
            currentP += 1;
            if (currentP <= paragraphs.length) {
              setVisibleParagraphCount(currentP);
            } else {
              clearInterval(interval);
            }
          }, 650);

          speakTutorText(paragraphs.join(' '), () => {
            if (autoContinue && currentStage.promptType === 'continue') {
              handleAdvanceStage();
            }
          });
          return () => clearInterval(interval);
        } else {
          // Character-by-character flow
          setVisibleParagraphCount(paragraphs.length);
          const fullLen = paragraphs.join(' ').length;
          setCharStreamLength(0);
          const interval = setInterval(() => {
            setCharStreamLength((prev) => {
              if (prev >= fullLen) {
                clearInterval(interval);
                return fullLen;
              }
              return prev + 5;
            });
          }, 25);
          speakTutorText(paragraphs.join(' '));
          return () => clearInterval(interval);
        }
      }, [stageIndex, activeChapterCode, activeCourseId]);

      // Keyboard shortcut: Press '1' to Continue / Yes when not typing in an input
      useEffect(() => {
        const onKeyDown = (e) => {
          const tag = document.activeElement?.tagName?.toLowerCase();
          if (tag === 'input' || tag === 'textarea') return;
          if (e.key === '1') {
            e.preventDefault();
            handleAdvanceStage();
          }
        };
        window.addEventListener('keydown', onKeyDown);
        return () => window.removeEventListener('keydown', onKeyDown);
      });

      // Switch to a different Course / Chapter
      const handleSelectCourseChapter = (courseId, chapCode) => {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        setIsThinkingStatus('Loading lesson...');
        setCatalogOpen(false);
        setTimeout(() => {
          setActiveCourseId(courseId);
          setActiveChapterCode(chapCode);
          setStageIndex(0);
          setPbiState({
            activeView: 'report',
            ribbonTab: 'Home',
            loadedTables: [],
            selectedTableInView: null,
            relationshipActive: true,
            relationshipVerified: false,
            daxMeasureCommitted: false,
            showFormulaBar: false,
            selectedVisualType: null,
            checkedFields: [],
            activeSlicerValue: 'All',
            dismissedGetDataBanner: false,
            userChangedViewManually: false
          });
          setIsThinkingStatus(null);
        }, 350);
      };

      // Auto-complete the current Power BI workspace step from anywhere in App
      const handleAutoPerformCurrentTask = () => {
        const ds = WORKSPACE_DATASETS[activeCourse.datasetKey] || WORKSPACE_DATASETS.faro;
        const factTable = ds.tables[0];
        const dimTable = ds.tables[1];
        const task = currentStage?.requiredTask;

        if (task === 'load_fact') {
          setPbiState((prev) => ({
            ...prev,
            loadedTables: Array.from(new Set([...prev.loadedTables, factTable.name])),
            activeView: 'table',
            selectedTableInView: factTable.name
          }));
          setVerificationFeedback({ type: 'success', text: currentStage.verificationSuccess });
          triggerToast(`Loaded ${factTable.name}.csv and opened Table View!`);
        } else if (task === 'load_dim') {
          setPbiState((prev) => ({
            ...prev,
            loadedTables: Array.from(new Set([...prev.loadedTables, factTable.name, dimTable.name])),
            selectedTableInView: dimTable.name
          }));
          setVerificationFeedback({ type: 'success', text: currentStage.verificationSuccess });
          triggerToast(`Loaded ${dimTable.name}.csv into the model!`);
        } else if (task === 'model_relationship') {
          setPbiState((prev) => ({
            ...prev,
            loadedTables: Array.from(new Set([...prev.loadedTables, factTable.name, dimTable.name])),
            activeView: 'model',
            relationshipActive: true,
            relationshipVerified: true
          }));
          setVerificationFeedback({ type: 'success', text: currentStage.verificationSuccess });
          triggerToast(`Verified 1:* relationship on ${ds.joinKey} in Model View!`);
        } else if (task === 'apply_dax_or_pq') {
          setPbiState((prev) => ({
            ...prev,
            daxMeasureCommitted: true,
            showFormulaBar: true
          }));
          setVerificationFeedback({ type: 'success', text: currentStage.verificationSuccess });
          triggerToast(`Committed DAX formula: ${activeChapter.daxFormula.split('=')[0]}!`);
        } else if (task === 'build_visual') {
          setPbiState((prev) => ({
            ...prev,
            loadedTables: Array.from(new Set([...prev.loadedTables, factTable.name, dimTable.name])),
            activeView: 'report',
            selectedVisualType: 'card',
            checkedFields: Array.from(new Set([...prev.checkedFields, ds.kpiMetricField]))
          }));
          setVerificationFeedback({ type: 'success', text: currentStage.verificationSuccess });
          triggerToast(`Created Card visual with ${ds.kpiLabel}!`);
        }
      };

      // Verify Power BI Workspace task (when Continue [1] is clicked on a hands-on stage)
      const handleAdvanceStage = () => {
        const ds = WORKSPACE_DATASETS[activeCourse.datasetKey] || WORKSPACE_DATASETS.faro;
        const factTable = ds.tables[0];
        const dimTable = ds.tables[1];

        // Check if current stage has a required Power BI task
        if (currentStage.type === 'pbi-workspace' && currentStage.requiredTask) {
          const task = currentStage.requiredTask;
          let passed = false;

          if (task === 'load_fact') {
            passed = pbiState.loadedTables.includes(factTable.name);
          } else if (task === 'load_dim') {
            passed = pbiState.loadedTables.includes(dimTable.name);
          } else if (task === 'model_relationship') {
            passed = pbiState.activeView === 'model' && pbiState.relationshipActive;
          } else if (task === 'apply_dax_or_pq') {
            passed = pbiState.daxMeasureCommitted || pbiState.activeView === 'powerquery';
          } else if (task === 'build_visual') {
            passed = pbiState.activeView === 'report' && pbiState.checkedFields.length > 0;
          }

          if (!passed) {
            setIsThinkingStatus('Thinking deeply...');
            setTimeout(() => {
              setIsThinkingStatus(null);
              setVerificationFeedback({
                type: 'hint',
                text: currentStage.verificationHint
              });
              speakTutorText(currentStage.verificationHint);
            }, 450);
            return;
          }
        }

        // Transition with "Gathering my thoughts..." / "Moving forward..." micro-animation
        const statusPhrases = ['Moving forward...', 'Gathering my thoughts...', 'Building on what we learned...'];
        setIsThinkingStatus(statusPhrases[stageIndex % statusPhrases.length]);
        setTimeout(() => {
          setIsThinkingStatus(null);
          if (stageIndex < stages.length - 1) {
            setStageIndex((prev) => prev + 1);
          } else {
            // Completed the chapter!
            if (!completedChapters.includes(activeChapter.code)) {
              setCompletedChapters((prev) => [...prev, activeChapter.code]);
            }
            // Advance to next chapter automatically if available
            const flatChapters = COURSES_DATA.flatMap((c) =>
              c.chapters.map((ch) => ({ courseId: c.id, chapCode: ch.code }))
            );
            const curIdx = flatChapters.findIndex((x) => x.chapCode === activeChapter.code);
            if (curIdx >= 0 && curIdx < flatChapters.length - 1) {
              const nextItem = flatChapters[curIdx + 1];
              handleSelectCourseChapter(nextItem.courseId, nextItem.chapCode);
              triggerToast(`Completed Chapter ${activeChapter.code}! Moving to ${nextItem.chapCode}...`);
            } else {
              triggerToast(`Congratulations! You completed ${activeChapter.code}!`);
            }
          }
        }, 420);
      };

      // Ask AI Tutor or Submit Role Response
      const handleSendTutorMessage = async (customMsg) => {
        const msg = (customMsg ?? tutorInput).trim();
        if (!msg) return;
        setTutorInput('');

        // If on Stage 1 (Role check-in), acknowledge and advance!
        if (currentStage.promptType === 'text-or-unsure') {
          setStageConversation((prev) => [...prev, { role: 'user', text: msg }]);
          setIsThinkingStatus('Formulating a helpful response...');
          setTimeout(() => {
            setIsThinkingStatus(null);
            const reply = `Thanks for sharing! I'll keep "${msg}" in mind as we work through ${activeChapter.title}. Let's get started with Power BI!`;
            setStageConversation((prev) => [...prev, { role: 'assistant', text: reply }]);
            speakTutorText(reply);
          }, 500);
          return;
        }

        // Otherwise answer question about current Power BI step
        setStageConversation((prev) => [...prev, { role: 'user', text: msg }]);
        setIsThinkingStatus('Formulating a helpful response...');

        if (userApiKey) {
          try {
            const res = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${userApiKey}`,
              {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  contents: [{ parts: [{ text: msg }] }],
                  systemInstruction: {
                    parts: [
                      {
                        text: `You are the built-in DataCamp-style Power BI AI Voice Tutor. You are teaching ${activeCourse.title}, Chapter ${activeChapter.code}: ${activeChapter.title}. Current step: ${currentStage.tutorParagraphs.join(' ')}. Answer concisely in 2-3 sentences.`
                      }
                    ]
                  }
                })
              }
            );
            const data = await res.json();
            const aiReply = data?.candidates?.[0]?.content?.parts?.[0]?.text;
            setIsThinkingStatus(null);
            if (aiReply) {
              setStageConversation((prev) => [...prev, { role: 'assistant', text: aiReply }]);
              speakTutorText(aiReply);
              return;
            }
          } catch (e) {
            // fallback below
          }
        }

        setTimeout(() => {
          setIsThinkingStatus(null);
          const fallbackReply = `Here's a quick tip for ${activeChapter.title}: ${
            currentStage.verificationHint ||
            `Use the formula ${activeChapter.daxFormula} and verify your 1:* relationship in Model view.`
          }`;
          setStageConversation((prev) => [...prev, { role: 'assistant', text: fallbackReply }]);
          speakTutorText(fallbackReply);
        }, 450);
      };

      const progressPct = Math.max(3, Math.round(((stageIndex + 1) / stages.length) * 100));

      return (
        <div className="h-screen w-screen flex overflow-hidden bg-white">
          {/* ================================================================
              1. LEFT PANE: BUILT-IN AI VOICE TUTOR (RESIZABLE EXACT VIDEO UI)
             ================================================================ */}
          <aside
            style={{ width: `${leftPaneWidth}px` }}
            className="shrink-0 h-full border-r border-slate-200 flex flex-col bg-white z-20 relative"
          >
            {/* Draggable Right Edge Resizer Handle */}
            <div
              onMouseDown={() => {
                isResizingRef.current = true;
              }}
              title="Drag edge to resize AI Tutor pane"
              className="absolute top-0 right-0 w-1.5 h-full cursor-col-resize hover:bg-indigo-400/60 transition z-30"
            />
            {/* Top Bar: Rocket Logo + Course/Chapter Selector Pill + Audio Wave Popover */}
            <div className="px-4 py-3 border-b border-slate-100 flex items-center justify-between gap-2 relative">
              <div className="flex items-center gap-2 min-w-0">
                <button
                  onClick={() => setCatalogOpen(true)}
                  className="w-8 h-8 rounded-lg hover:bg-slate-100 flex items-center justify-center text-slate-800 font-black shrink-0"
                  title="Open Full 17-Course Curriculum"
                >
                  <svg className="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M4 3l16 9-16 9V3z" />
                  </svg>
                </button>

                {/* Course / Chapter Breadcrumb Pill + Audio Wave Trigger */}
                <div className="flex items-center bg-slate-100/90 border border-slate-200/80 rounded-xl px-2.5 py-1.5 gap-2 min-w-0">
                  <button
                    onClick={() => setCatalogOpen(true)}
                    className="text-xs font-medium text-slate-700 hover:text-indigo-600 truncate max-w-[195px] flex items-center gap-1"
                    title="Click to switch between all 17 Courses and 59 Chapters"
                  >
                    <span className="truncate">{activeCourse.title.replace(/^\d+\.\s*/, '')}</span>
                    <span className="text-slate-400">/</span>
                    <span className="font-semibold text-slate-900 truncate">{activeChapter.code}: {activeChapter.title}</span>
                  </button>

                  <div className="h-4 w-px bg-slate-300" />

                  <button
                    onClick={() => {
                      setAudioPopoverOpen((v) => !v);
                      setAudioSubMenu(null);
                    }}
                    className={`px-1.5 py-0.5 rounded-md flex items-center gap-1 transition ${
                      isSpeaking
                        ? 'bg-indigo-100 text-indigo-700 font-bold'
                        : 'text-indigo-600 hover:bg-slate-200/70'
                    }`}
                    title="Tutor Audio & Voice Settings"
                  >
                    <AudioWaveIcon className={`w-4 h-4 ${isSpeaking ? 'animate-pulse' : ''}`} />
                    <ChevronDownIcon className="w-3 h-3" />
                  </button>
                </div>
              </div>

              {/* Stage Counter Pill */}
              <div className="flex items-center gap-1 shrink-0">
                <button
                  disabled={stageIndex === 0}
                  onClick={() => setStageIndex((s) => Math.max(0, s - 1))}
                  className="p-1 rounded hover:bg-slate-100 disabled:opacity-30 text-slate-500"
                  title="Previous Step"
                >
                  <ChevronLeftIcon className="w-4 h-4" />
                </button>
                <span className="text-[11px] font-mono text-slate-400">
                  {stageIndex + 1}/{stages.length}
                </span>
                <button
                  onClick={() => setStageIndex((s) => Math.min(stages.length - 1, s + 1))}
                  className="p-1 rounded hover:bg-slate-100 text-slate-500"
                  title="Skip to Next Step"
                >
                  <ChevronRightIcon className="w-4 h-4" />
                </button>
              </div>

              {/* ============================================================
                  AUDIO SETTINGS POPOVER (EXACT REPLICA OF 03:12–03:52 IN VIDEO)
                 ============================================================ */}
              {audioPopoverOpen && (
                <div className="absolute left-6 top-14 z-50 w-64 bg-white rounded-xl shadow-2xl border border-slate-200 p-3 space-y-2 text-xs">
                  {/* Audio Toggle */}
                  <div className="flex items-center justify-between px-2 py-1.5">
                    <div>
                      <div className="font-bold text-slate-800">Audio</div>
                      <div className="text-[11px] text-slate-400">Plays as tutor messages are generated</div>
                    </div>
                    <button
                      onClick={() => {
                        const next = !audioEnabled;
                        setAudioEnabled(next);
                        if (!next && 'speechSynthesis' in window) window.speechSynthesis.cancel();
                      }}
                      className={`w-10 h-5 rounded-full transition p-0.5 ${
                        audioEnabled ? 'bg-indigo-600' : 'bg-slate-300'
                      }`}
                    >
                      <div className={`w-4 h-4 rounded-full bg-white transition transform ${audioEnabled ? 'translate-x-5' : ''}`} />
                    </button>
                  </div>

                  <div className="border-t border-slate-100" />

                  {/* Tutor Voice */}
                  <div className="relative">
                    <button
                      onClick={() => setAudioSubMenu(audioSubMenu === 'voice' ? null : 'voice')}
                      className="w-full px-2 py-1.5 rounded-lg hover:bg-slate-50 flex items-center justify-between text-slate-700 font-medium"
                    >
                      <span className="flex items-center gap-2">🗣️ Tutor Voice</span>
                      <ChevronRightIcon className="w-3.5 h-3.5 text-slate-400" />
                    </button>
                    {audioSubMenu === 'voice' && (
                      <div className="mt-1 p-1.5 bg-slate-50 rounded-lg border border-slate-200 max-h-36 overflow-y-auto space-y-1">
                        {availableVoices.slice(0, 8).map((v) => (
                          <button
                            key={v.voiceURI}
                            onClick={() => {
                              setSelectedVoiceURI(v.voiceURI);
                              setAudioSubMenu(null);
                            }}
                            className={`w-full px-2 py-1 rounded text-left text-[11px] truncate flex items-center justify-between ${
                              selectedVoiceURI === v.voiceURI ? 'bg-indigo-50 text-indigo-700 font-bold' : 'text-slate-600 hover:bg-white'
                            }`}
                          >
                            <span className="truncate">{v.name}</span>
                            {selectedVoiceURI === v.voiceURI && <CheckIcon className="w-3 h-3 shrink-0" />}
                          </button>
                        ))}
                      </div>
                    )}
                  </div>

                  {/* Audio Speed (0.75, 1, 1.25, 1.5, 2) */}
                  <div className="relative">
                    <button
                      onClick={() => setAudioSubMenu(audioSubMenu === 'speed' ? null : 'speed')}
                      className="w-full px-2 py-1.5 rounded-lg hover:bg-slate-50 flex items-center justify-between text-slate-700 font-medium"
                    >
                      <span className="flex items-center gap-2">⏱️ Audio Speed ({audioSpeed}x)</span>
                      <ChevronRightIcon className="w-3.5 h-3.5 text-slate-400" />
                    </button>
                    {audioSubMenu === 'speed' && (
                      <div className="mt-1 p-1.5 bg-slate-50 rounded-lg border border-slate-200 grid grid-cols-5 gap-1">
                        {[0.75, 1, 1.25, 1.5, 2].map((sp) => (
                          <button
                            key={sp}
                            onClick={() => {
                              setAudioSpeed(sp);
                              setAudioSubMenu(null);
                            }}
                            className={`py-1 rounded text-center font-semibold ${
                              audioSpeed === sp ? 'bg-indigo-600 text-white' : 'bg-white text-slate-700 hover:bg-slate-100'
                            }`}
                          >
                            {sp}
                          </button>
                        ))}
                      </div>
                    )}
                  </div>

                  {/* Text Flow (Character vs Sentence) */}
                  <div className="relative">
                    <button
                      onClick={() => setAudioSubMenu(audioSubMenu === 'flow' ? null : 'flow')}
                      className="w-full px-2 py-1.5 rounded-lg hover:bg-slate-50 flex items-center justify-between text-slate-700 font-medium"
                    >
                      <span className="flex items-center gap-2">≡ Text Flow ({textFlowMode})</span>
                      <ChevronRightIcon className="w-3.5 h-3.5 text-slate-400" />
                    </button>
                    {audioSubMenu === 'flow' && (
                      <div className="mt-1 p-2 bg-slate-50 rounded-lg border border-slate-200 space-y-1.5">
                        {[
                          { id: 'character', title: 'Character', desc: 'Show text letter by letter in sync with speech' },
                          { id: 'sentence', title: 'Sentence', desc: 'Show and read one sentence at a time' }
                        ].map((mode) => (
                          <button
                            key={mode.id}
                            onClick={() => {
                              setTextFlowMode(mode.id);
                              setAudioSubMenu(null);
                            }}
                            className={`w-full p-2 rounded-lg text-left flex items-start justify-between ${
                              textFlowMode === mode.id ? 'bg-white border border-indigo-200 shadow-sm' : 'hover:bg-white'
                            }`}
                          >
                            <div>
                              <div className="font-bold text-slate-800">{mode.title}</div>
                              <div className="text-[10px] text-slate-500">{mode.desc}</div>
                            </div>
                            {textFlowMode === mode.id && <CheckIcon className="w-3.5 h-3.5 text-indigo-600 shrink-0 mt-1" />}
                          </button>
                        ))}
                      </div>
                    )}
                  </div>

                  <div className="border-t border-slate-100" />

                  {/* Auto Continue Toggle */}
                  <div className="flex items-center justify-between px-2 py-1.5">
                    <div>
                      <div className="font-bold text-slate-800">Auto Continue</div>
                      <div className="text-[11px] text-slate-400">Continue to next message automatically</div>
                    </div>
                    <button
                      onClick={() => setAutoContinue((v) => !v)}
                      className={`w-10 h-5 rounded-full transition p-0.5 ${
                        autoContinue ? 'bg-indigo-600' : 'bg-slate-300'
                      }`}
                    >
                      <div className={`w-4 h-4 rounded-full bg-white transition transform ${autoContinue ? 'translate-x-5' : ''}`} />
                    </button>
                  </div>
                </div>
              )}
            </div>

            {/* ==============================================================
                TUTOR CONVERSATIONAL LESSON STREAM (MIDDLE SCROLLABLE AREA)
               ============================================================== */}
            <div
              onClick={() => setAudioPopoverOpen(false)}
              className="flex-1 overflow-y-auto px-6 py-5 space-y-4 text-[14.5px] leading-relaxed text-slate-800"
            >
              {isThinkingStatus ? (
                <div className="flex items-center gap-2.5 text-slate-500 text-sm py-4">
                  <span className="w-2.5 h-2.5 rounded-full bg-slate-700 animate-ping" />
                  <span>{isThinkingStatus}</span>
                </div>
              ) : (
                <>
                  {/* Render Tutor Paragraphs with Inline Code Formatting & Speaking Dot */}
                  {(currentStage.tutorParagraphs || [])
                    .slice(0, visibleParagraphCount)
                    .map((para, pIdx, arr) => {
                      const isLastVisible = pIdx === arr.length - 1;
                      const displayedText =
                        textFlowMode === 'character' && isLastVisible
                          ? para.slice(0, charStreamLength)
                          : para;

                      return (
                        <div
                          key={pIdx}
                          onClick={() => speakTutorText(para)}
                          className="cursor-pointer hover:bg-slate-50/80 rounded-lg p-1 -mx-1 transition"
                          title="Click any paragraph to hear the AI Tutor read it aloud"
                        >
                          <span>{displayedText}</span>
                          {isLastVisible && (
                            <span
                              className={`inline-block w-2 h-2 rounded-full ml-1.5 align-middle ${
                                isSpeaking ? 'bg-indigo-600 animate-pulse' : 'bg-slate-400'
                              }`}
                            />
                          )}
                        </div>
                      );
                    })}

                  {/* Step-by-Step In-Built Database Context Pill inside AI Tutor */}
                  {(() => {
                    const activeDs = WORKSPACE_DATASETS[activeCourse.datasetKey] || WORKSPACE_DATASETS.faro;
                    const primaryFact = activeDs.tables[0];
                    const primaryDim = activeDs.tables[1];
                    return (
                      <div className="p-3 rounded-xl bg-slate-50 border border-slate-200/90 space-y-2 text-xs">
                        <div className="flex items-center justify-between">
                          <span className="font-bold text-slate-700 flex items-center gap-1.5">
                            <TableIcon className="w-3.5 h-3.5 text-teal-700" />
                            In-Built Database: <span className="font-mono text-indigo-700">{activeDs.id.toUpperCase()}_DB</span>
                          </span>
                          <button
                            onClick={() => setDbHubModalOpen(true)}
                            className="px-2 py-0.5 rounded bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold text-[10px] border border-indigo-200 transition"
                          >
                            Inspect / Download CSVs
                          </button>
                        </div>
                        <div className="text-[11px] text-slate-600 font-mono bg-white p-2 rounded border border-slate-200/80 overflow-x-auto">
                          <div>• Fact: <strong>{primaryFact.name}</strong> ({primaryFact.totalRows} rows) | Key: <strong>{activeDs.joinKey}</strong></div>

            </div>
          )}

          {/* ================================================================
              MODAL C: OPTIONAL GEMINI API KEY MODAL (FOR GITHUB PAGES)
             ================================================================ */}
          {apiKeyModalOpen && (
            <div className="fixed inset-0 bg-slate-900/50 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-5 space-y-3 shadow-2xl border border-slate-200 text-xs">
                <div className="flex items-center justify-between">
                  <span className="font-bold text-sm text-slate-900">Optional Gemini API Key</span>
                  <button onClick={() => setApiKeyModalOpen(false)} className="text-slate-400">✕</button>
                </div>
                <p className="text-slate-600 leading-relaxed">
                  All 17 courses, 59 chapters, voice read-aloud narration, and the embedded Power BI workspace work 100% free out of the box. Enter a Gemini API key below if you want live custom Q&A responses in the chat box (saved only in your browser's localStorage):
                </p>
                <input
                  type="password"
                  value={userApiKey}
                  onChange={(e) => {
                    setUserApiKey(e.target.value);
                    localStorage.setItem('pbi_gemini_key', e.target.value);
                  }}
                  placeholder="AIzaSy..."
                  className="w-full border border-slate-300 rounded-lg px-3 py-2 font-mono text-slate-800"
                />
                <div className="flex justify-end">
                  <button
                    onClick={() => setApiKeyModalOpen(false)}
                    className="px-4 py-1.5 rounded-lg bg-indigo-600 text-white font-bold"
                  >
                    Save & Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ================================================================
              MODAL D: SKILL TRACK MASTERY CERTIFICATE GENERATOR
             ================================================================ */}
          {certificateModalOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-2xl w-full p-6 space-y-4 shadow-2xl border-2 border-amber-300 text-center relative">
                <button
                  onClick={() => setCertificateModalOpen(false)}
                  className="absolute top-4 right-4 p-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-500"
                >
                  <XIcon className="w-4 h-4" />
                </button>
                <div className="inline-block px-3 py-1 rounded-full bg-amber-100 text-amber-800 font-bold text-xs uppercase tracking-widest">
                  Power BI Fundamentals to Expert Track
                </div>
                <h3 className="text-2xl font-black text-slate-900">
                  Certificate of Interactive Mastery
                </h3>
                <p className="text-xs text-slate-500">
                  Customize your name below to generate your verifiable completion summary across all 17 Courses & 59 Chapters:
                </p>
                <input
                  type="text"
                  value={studentName}
                  onChange={(e) => setStudentName(e.target.value)}
                  className="text-center text-lg font-extrabold text-indigo-700 border-b-2 border-indigo-300 focus:border-indigo-600 focus:outline-none px-4 py-1"
                />
                <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 text-xs text-slate-600 space-y-1">
                  <div>Completed Chapters: <strong>{completedChapters.length} / 59 Chapters</strong></div>
                  <div>Active Specialization: <strong>{activeCourse.title} ({activeChapter.code})</strong></div>
                  <div>In-Built Relational Databases Practiced: <strong>6 Enterprise Semantic Models</strong></div>
                </div>
                <div className="flex justify-center gap-3 pt-2">
                  <button
                    onClick={() => {
                      window.print();
                    }}
                    className="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs"
                  >
                    Print / Save Certificate as PDF
                  </button>
                  <button
                    onClick={() => setCertificateModalOpen(false)}
                    className="px-4 py-2 rounded-xl border border-slate-300 text-slate-700 font-semibold text-xs"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
